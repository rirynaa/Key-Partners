<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Key Partners</title>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script type="module" src="./script.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="./style.css">
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

</head>
<body>
    <div class="container">
        <header id="header">
            <div class="headerContainer">
                <img src = https://www.clarkconstruction.com/themes/custom/clark/logo.svg alt = "Clark Construction Logo" class="logo">
            </div>
        </header>
        <div class="mapIntro">
            <h1>Potential Partners in DC</h1>
            <p>Explore the map to discover key potential partners in the District of Columbia. <br>This map was built by Aridiai for Clark Water.</p>
        </div>
        <div class="filterPanel">
            <p> Filter by organization type and ward.</p>
            <div class="dropdown" id="typeSelect">
                <button class="dropButton">Organization Type ▾</button>
                <div class="dropdownContent">
                    <label><input type="checkbox" class="type_filter" value="church"> Church</label>
                    <label><input type="checkbox" class="type_filter" value="social_welfare"> Social Welfare</label>
                    <label><input type="checkbox" class="type_filter" value="food_bank"> Food Bank</label>
                    <label><input type="checkbox" class="type_filter" value="youth_focused"> Youth Focused</label>
                    <label><input type="checkbox" class="type_filter" value="career_workforce"> Career Workforce</label>
                    <label><input type="checkbox" class="type_filter" value="school"> School</label>
                    <label><input type="checkbox" class="type_filter" value="adv_neighborhood_commission"> Community Organizations</label>
                    <label><input type="checkbox" class="type_filter" value="arts"> Arts</label>
                    <label><input type="checkbox" class="type_filter" value="health_services"> Health Services</label>
                </div>
            </div>
            <div class="dropdown" id="wardSelect">
                <button class="dropButton"> Ward ▾</button>
                <div class="dropdownContent">
                    <label><input type="checkbox" class="ward_filter" value="5"> Ward 5</label>
                    <label><input type="checkbox" class="ward_filter" value="6"> Ward 6</label>
                    <label><input type="checkbox" class="ward_filter" value="7"> Ward 7</label>
                    <label><input type="checkbox" class="ward_filter" value="8"> Ward 8</label>
                </div>
            </div>
            <button id="submitButton">Submit</button>
        </div>
        <div class="mapContainer">
            <div id="map"></div>
        </div>
        <div class="footer">
            <img src="https://cdn.prod.website-files.com/5ef7cac3732034bfecec5a61/5f09f9e6bf7bfce53bfd56ed_aridai-logo-onDark-transparent%402x.png" alt="Aridai Logo" style="height: 50px;">
            <p class="footerText">&copy; 2026 Aridai. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
